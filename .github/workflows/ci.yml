name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -race ./...
      - run: go vet ./...
      - run: node tests/zen-palette.test.js
      - run: npx --yes web-ext@latest lint --source-dir zen-extension
