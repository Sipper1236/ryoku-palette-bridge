name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go test -race ./...
      - run: go vet ./...
      - run: node tests/zen-palette.test.js
      - run: node tests/spicetify-palette.test.js
      - run: node tests/zen-theme-schema.test.js
      - run: bash -n install.sh install-integrations.sh setup-zen-signing.sh tests/*.sh
      - run: ./tests/install.test.sh
      - run: ./tests/install-integrations.test.sh
      - run: ./tests/doctor.test.sh
      - run: npx --yes web-ext@latest lint --source-dir zen-extension
